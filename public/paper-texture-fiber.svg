<svg xmlns="http://www.w3.org/2000/svg" width="190" height="130" viewBox="0 0 190 130">
  <!-- Seamless, continuous micro-relief for fine paper; no discrete fiber strokes. -->
  <defs>
    <filter id="woven-paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".34 .46" numOctaves="3" seed="17" stitchTiles="stitch" result="relief"/>
      <feColorMatrix in="relief" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncR type="linear" slope=".25" intercept=".76"/>
        <feFuncG type="linear" slope=".25" intercept=".76"/>
        <feFuncB type="linear" slope=".25" intercept=".76"/>
        <feFuncA type="identity"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="190" height="130" fill="#ffffff"/>
  <rect width="190" height="130" filter="url(#woven-paper)"/>
</svg>
