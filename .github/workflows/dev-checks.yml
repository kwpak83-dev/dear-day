name: Dev checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node tests and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: dear_day_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dear_day_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all Node.js tests
        run: node --test tests/*.test.mjs
      - name: Validate upload reservations in isolated PostgreSQL
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/upload-reservation-smoke.sql
      - name: Validate deletion retry and lease safety in PostgreSQL
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/deletion-job-retry-smoke.sql
      - name: Validate manual and automatic deletion transactions
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/deletion-atomic-smoke.sql
      - name: Test concurrent deletion versus upload reservation
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: dear_day_ci
          PGPASSWORD: test-only
        run: bash tests/sql/upload-delete-race.sh
      - name: Verify manual deletion job-first lock order
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: dear_day_ci
          PGPASSWORD: test-only
        run: bash tests/sql/manual-deletion-lock-order.sh
      - name: Validate retention rescheduling in PostgreSQL
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/retention-schedule-smoke.sql
      - name: Validate Storage object fences in PostgreSQL
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/storage-object-fence-smoke.sql
      - name: Validate Storage reference inventory in PostgreSQL
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/storage-reference-inventory-smoke.sql
      - name: Validate Storage metadata upload guard in PostgreSQL
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d dear_day_ci -f tests/sql/storage-write-guard-smoke.sql
      - name: Validate retention migrations 001 through 021 in order
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h 127.0.0.1 -U postgres dear_day_migration_order_ci
          psql -h 127.0.0.1 -U postgres -d dear_day_migration_order_ci -f tests/sql/retention-migration-order-smoke.sql
      - name: Build Next.js
        run: pnpm build
